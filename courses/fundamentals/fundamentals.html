<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentals of Robotics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
            text-size-adjust: 100%;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="hero-gradient py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl font-extrabold text-white">Fundamentals of Robotics</h1>
            <p class="mt-4 text-lg text-blue-100">Explore the basics of robotics through these modules.</p>
        </div>
    </header>
    <main class="py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="modules-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </main>
    <footer class="bg-gray-800 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-sm text-gray-400">&copy; 2025 Botronix Labs. All rights reserved.</p>
        </div>
    </footer>
    <script>
      // Define your modules here
      const modules = [
        {
          title: 'Preparing Your Pico Board to Run MicroPython',
          link: 'module1.html',
        },
        {
          title: 'Interfacing 7-Segment Display & Push Button',
          link: 'module2.html',
        },
        {
          title: 'Make It Beep! Detect Distance with Ultrasonic Sensor and Buzzer Alert',
          link: 'module3.html',
        },
        {
          title: 'Power Up & Drive: Using a 3.7V Battery to Control a 360° Servo with Raspberry Pi Pico!',
          link: 'module4.html',
        },
        {
          title: 'Milestone: Build a Pico Otto Robot Car',
          link: 'module5.html',
        },
        {
          title: 'Testing 180° Servo Motor (4DOF Robot Arm Project)',
          link: 'module6.html',
        },
        {
          title: 'Smooth Servo Sweeping with 4-DOF Robotic Arm',
          link: 'module7.html',
          description: 'Continue from Module 6: Learn to control a 4-DOF robotic arm with smooth servo motion and realistic pick-and-drop sequences using MicroPython.'
        },
        {
          title: 'Introduction to Joystick Control (Base Rotation)',
          link: 'module8.html',
          description: 'This module introduces real-time manual control using a joystick to rotate the base of your robotic arm. You’ll explore how a joystick works, read analog values with Raspberry Pi Pico, and implement smooth servo movement using real-time logic.'
        },
        {
          title: 'Module 9: Full Robotic Arm Control with Dual Joysticks and LED Indicator',
          link: 'module9.html',
          description: 'Control all four joints of your robotic arm using two joysticks and a status LED. Learn to map analog joystick inputs to servos for real-time, multi-axis movement and add interactive feedback with an LED.'
        },
        {
          title: 'Recording and Playback of Robotic Arm Movements',
          link: 'module10.html',
          description: 'Learn to record and replay robotic arm movements using joystick control and two-button operation. Implement human-in-the-loop recording, playback, and smooth servo motion for gesture learning and automation.'
        },
      ];
      const modulesList = document.getElementById('modules-list');
      modules.forEach((mod, idx) => {
        const card = document.createElement('div');
        card.className = 'module-card bg-white shadow rounded-2xl p-10 min-h-[220px] flex flex-col justify-between transition-transform duration-200' + (mod.link ? ' cursor-pointer' : '');
        if (mod.link) {
          card.onclick = () => { location.href = mod.link; };
        }
        card.innerHTML = `
          <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Module ${idx + 1}</h2>
          <p class="mt-2 text-lg text-gray-700">${mod.title}</p>
          ${mod.description ? `<p class=\"mt-4 text-base text-gray-500\">${mod.description}</p>` : ''}
        `;
        modulesList.appendChild(card);
      });
    </script>
</body>
</html>
