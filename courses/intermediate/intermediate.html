<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intermediate Robotics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
            text-size-adjust: 100%;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%);
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2366675854686882"
     crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50">
    <header class="hero-gradient py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl font-extrabold text-white">Intermediate Robotics</h1>
            <p class="mt-4 text-lg text-blue-100">Build advanced robots with Pico W, wireless control, OOP, DC motors, and more sensors.</p>
        </div>
    </header>
    <main class="py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="modules-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </main>
    <footer class="bg-gray-800 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-sm text-gray-400">&copy; 2025 Botronix Labs. All rights reserved.</p>
        </div>
    </footer>
    <script>
      // Define your modules here
      const modules = [
        {
          title: 'DC Gear Motors, Motor Driver Board & OOP Concepts',
          link: 'module1.html',
          description: 'Start the PicoTank project! Learn about DC gear motors, H-bridge driver boards, and get introduced to object-oriented programming (OOP) for robotics using Pico W.'
        },
        {
          title: 'BLE-Controlled Smart Robot Tank with Obstacle Detection',
          link: 'module2.html',
          description: 'This module covers object-oriented design in MicroPython, BLE-based wireless communication between two Pico W boards, and obstacle avoidance using an IR sensor.'
        }
      ];
      const modulesList = document.getElementById('modules-list');
      modules.forEach((mod, idx) => {
        const card = document.createElement('div');
        card.className = 'module-card bg-white shadow rounded-2xl p-10 min-h-[220px] flex flex-col justify-between transition-transform duration-200' + (mod.link ? ' cursor-pointer' : '');
        if (mod.link) {
          card.onclick = () => { location.href = mod.link; };
        }
        card.innerHTML = `
          <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Module ${idx + 1}</h2>
          <p class="mt-2 text-lg text-gray-700">${mod.title}</p>
          ${mod.description ? `<p class=\"mt-4 text-base text-gray-500\">${mod.description}</p>` : ''}
        `;
        modulesList.appendChild(card);
      });
    </script>
</body>
</html>
